name: Build Study Flow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html sw.js manifest.json icon-192.png icon-512.png www/

      - name: Create Android project
        run: npx cap add android

      - name: Apply icons, splash and colours
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          bash customize-android.sh android icon-512.png

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
